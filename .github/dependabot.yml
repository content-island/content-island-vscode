# Docs: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: 'npm'
    directory: /
    schedule:
      interval: 'daily'
    target-branch: 'develop'
    allow:
      - dependency-name: '@content-island/vscode-api-client'
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: 'npm'
    directory: /
    schedule:
      interval: 'weekly'
      day: 'monday'
    ignore:
      - dependency-name: '@content-island/vscode-api-client'
    groups:
      production-dependencies:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
      dev-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
    commit-message:
      prefix: 'chore(deps)'
    labels:
      - 'dependencies'
